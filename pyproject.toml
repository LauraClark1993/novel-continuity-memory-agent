[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-memory-agent"
version = "0.1.0"
description = "面向长篇小说创作的结构化长期记忆与按需检索 Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
novel-memory = "novel_memory_agent.cli:main"

[tool.setuptools.packages.find]
include = ["novel_memory_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
